info:
  name: FechaPasada
  type: http

http:
  method: POST
  url: http://localhost:8080/api/reservas
  body:
    type: json
    data: |-
      {
        "ambienteId": 2,
        "nombreInstructor": "Instructor X",
        "fechaInicio": "2024-01-01T10:00:00",
        "fechaFin": "2024-01-01T12:00:00",
        "numeroAprendices": 10
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
