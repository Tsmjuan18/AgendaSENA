info:
  name: CrearReserva
  type: http

http:
  method: POST
  url: http://localhost:8080/api/reservas
  body:
    type: json
    data: |-
      {
        "ambienteId": 2,
        "nombreInstructor": "Nuevo Instructor",
        "fechaInicio": "2026-06-24T08:00:00",
        "fechaFin": "2026-06-24T10:00:00",
        "numeroAprendices": 15
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
